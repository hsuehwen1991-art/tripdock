<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TripDock｜旅行資訊綜合管理系統</title>
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TripDock" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />

  <!-- Tailwind CSS + Typography (供說明書 Markdown 排版) -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              900: '#134e4a'
            }
          }
        }
      }
    };
  </script>
  <!-- Marked.js 渲染內建 USER_GUIDE.md -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- 唯一設定檔（網頁與 Service Worker 共用） -->
  <script src="./js/config.js"></script>
  <style>
    html, body {
      overflow-x: hidden;
      overscroll-behavior-x: none;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .td-modal-scroll {
      overflow-x: hidden;
      overscroll-behavior-x: none;
      touch-action: pan-y;
    }
    #modal-panel input, #modal-panel select, #modal-panel textarea {
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }
    /* 修正 iOS Safari 原生日期/時間欄位撐出彈窗與文字置中問題 */
    input[type="date"],
    input[type="time"] {
      -webkit-appearance: none !important;
      appearance: none !important;
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
      min-height: 40px;
      line-height: 1.4;
      box-sizing: border-box !important;
      overflow: hidden;
      text-align: left;
    }
    input[type="date"]::-webkit-date-and-time-value,
    input[type="time"]::-webkit-date-and-time-value {
      text-align: left;
      min-width: 0;
      margin: 0;
    }

    /* ===== 輕量版 Liquid Glass 材質（僅套用於導覽列、分頁列與重點按鈕） ===== */
    .glass-header {
      background: rgba(255, 255, 255, 0.74);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 1px 12px rgba(15, 23, 42, 0.05);
    }
    .glass-bar {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 4px 16px rgba(15, 23, 42, 0.06);
    }
    .glass-btn-primary {
      background: linear-gradient(135deg, rgba(20, 184, 166, 0.88), rgba(15, 118, 110, 0.95));
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.34);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 4px 14px rgba(13, 148, 136, 0.24);
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.16s ease, filter 0.16s ease;
    }
    .glass-btn-primary:hover {
      filter: brightness(1.04);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 6px 18px rgba(13, 148, 136, 0.30);
    }
    .glass-btn-primary:active {
      transform: scale(0.965);
    }
    .glass-btn-teal-soft {
      background: linear-gradient(135deg, rgba(240, 253, 250, 0.92), rgba(204, 251, 241, 0.75));
      color: #0f766e;
      border: 1px solid rgba(94, 234, 212, 0.55);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 2px 8px rgba(13, 148, 136, 0.08);
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.16s ease;
    }
    .glass-btn-teal-soft:active {
      transform: scale(0.965);
    }
    .glass-btn-subtle {
      background: rgba(255, 255, 255, 0.75);
      color: #334155;
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 2px 8px rgba(15, 23, 42, 0.04);
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.16s ease;
    }
    .glass-btn-subtle:hover {
      background: rgba(248, 250, 252, 0.95);
    }
    .glass-btn-subtle:active {
      transform: scale(0.965);
    }
    .glass-btn-danger {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.90), rgba(225, 29, 72, 0.96));
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.38), 0 4px 12px rgba(225, 29, 72, 0.22);
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), filter 0.16s ease;
    }
    .glass-btn-danger:active {
      transform: scale(0.965);
    }

    /* ===== GPU 加速頁面與分頁切換動畫 ===== */
    @keyframes tdViewIn {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .td-view-enter {
      animation: tdViewIn 0.19s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* ===== GPU 加速 3D 卡片翻轉居中彈窗動畫（全站彈窗適用） ===== */
    .td-modal-stage {
      perspective: 1200px;
    }
    @keyframes tdBackdropIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes tdBackdropOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    @keyframes tdCardFlipIn {
      0% { opacity: 0; transform: rotateY(-24deg) scale(0.91); }
      100% { opacity: 1; transform: rotateY(0deg) scale(1); }
    }
    @keyframes tdCardFlipOut {
      0% { opacity: 1; transform: rotateY(0deg) scale(1); }
      100% { opacity: 0; transform: rotateY(16deg) scale(0.92); }
    }
    @keyframes tdCardFlipSwitch {
      0% { opacity: 0.25; transform: rotateY(-86deg) scale(0.96); }
      100% { opacity: 1; transform: rotateY(0deg) scale(1); }
    }
    .td-modal-backdrop-enter {
      animation: tdBackdropIn 0.18s ease-out both;
    }
    .td-modal-backdrop-exit {
      animation: tdBackdropOut 0.16s ease-in both;
    }
    .td-modal-panel {
      transform-style: preserve-3d;
      backface-visibility: hidden;
      will-change: transform, opacity;
    }
    .td-modal-panel-enter {
      animation: tdCardFlipIn 0.26s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .td-modal-panel-flip {
      animation: tdCardFlipSwitch 0.26s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .td-modal-panel-exit {
      animation: tdCardFlipOut 0.16s ease-in both;
    }

    /* ===== 手機版旅行卡片左滑刪除 ===== */
    .trip-swipe-card {
      touch-action: pan-y;
      will-change: transform;
    }

    /* ===== 通知鈴鐺三態樣式（灰 / 綠 / 紅斜線） ===== */
    .glass-btn-bell-off {
      background: rgba(241, 245, 249, 0.85);
      color: #64748b;
      border: 1px solid rgba(203, 213, 225, 0.9);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: transform 0.16s ease, background-color 0.16s ease;
    }
    .glass-btn-bell-on {
      background: linear-gradient(135deg, rgba(236, 253, 245, 0.95), rgba(209, 250, 229, 0.85));
      color: #059669;
      border: 1px solid rgba(110, 231, 183, 0.75);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 2px 8px rgba(16, 185, 129, 0.14);
      transition: transform 0.16s ease, background-color 0.16s ease;
    }
    .glass-btn-bell-muted {
      background: linear-gradient(135deg, rgba(255, 241, 242, 0.96), rgba(255, 228, 230, 0.88));
      color: #e11d48;
      border: 1px solid rgba(253, 164, 175, 0.8);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 2px 8px rgba(225, 29, 72, 0.12);
      transition: transform 0.16s ease, background-color 0.16s ease;
    }
    .glass-btn-bell-off:active,
    .glass-btn-bell-on:active,
    .glass-btn-bell-muted:active {
      transform: scale(0.95);
    }

    /* ===== 前景推播浮動通知橫幅 ===== */
    @keyframes tdPushBannerIn {
      from { opacity: 0; transform: translate(-50%, -18px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .td-push-banner {
      animation: tdPushBannerIn 0.24s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* ===== 啟動載入畫面（3 秒貓咪奔跑 + 進度條） ===== */
    #td-splash {
      transition: opacity 0.32s ease, transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #td-splash.td-splash-exit {
      opacity: 0;
      transform: scale(1.03);
      pointer-events: none;
    }
    .td-progress-fill {
      background: linear-gradient(90deg, #2dd4bf, #0d9488);
      box-shadow: 0 0 10px rgba(20, 184, 166, 0.45);
      transition: width 0.12s linear;
    }

    /* ===== 右下角像素貓咪通知客服 ===== */
    .td-cat-sprite {
      background-image: url('./icons/cat-concierge.webp?v=3.16');
      background-size: 400% 100%;
      background-repeat: no-repeat;
      background-position: 0% 0%;
      image-rendering: pixelated;
      filter: drop-shadow(0 6px 10px rgba(15, 23, 42, 0.14));
      will-change: transform, background-position;
    }
    @keyframes tdCatHop {
      0% { transform: scale(1) translateY(0); }
      38% { transform: scale(1.09, 0.94) translateY(-9px); }
      72% { transform: scale(0.96, 1.04) translateY(0); }
      100% { transform: scale(1) translateY(0); }
    }
    .td-cat-hop {
      animation: tdCatHop 0.30s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes tdBubbleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .td-cat-bubble {
      animation: tdBubbleFloat 2.4s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <!-- 啟動載入覆蓋層（強制至少 3 秒並與背景同步並行） -->
  <div id="td-splash" class="fixed inset-0 z-[200] bg-slate-50 flex items-center justify-center px-6">
    <div class="w-full max-w-[240px] text-center space-y-3">
      <img src="./icons/loading-cat.webp" width="128" height="128" alt="TripDock 載入中" class="w-32 h-32 mx-auto object-contain select-none" style="image-rendering: pixelated;" />
      <div class="space-y-1.5">
        <div class="w-full h-2 rounded-full bg-slate-200/85 overflow-hidden p-[1px]">
          <div id="td-splash-bar" class="td-progress-fill h-full rounded-full" style="width: 4%;"></div>
        </div>
        <div class="flex items-center justify-between text-[11px] font-medium text-slate-500 px-0.5">
          <span id="td-splash-status">正在啟動 TripDock...</span>
          <span id="td-splash-pct" class="tabular-nums text-teal-700 font-semibold">4%</span>
        </div>
      </div>
    </div>
  </div>

  <div id="app"></div>

  <script>
    (function () {
      const MIN_MS = 3000;
      const MAX_WAIT_MS = 6500;
      const startTime = performance.now();
      let syncReady = false;
      let finished = false;

      const splashEl = document.getElementById('td-splash');
      const barEl = document.getElementById('td-splash-bar');
      const pctEl = document.getElementById('td-splash-pct');
      const statusEl = document.getElementById('td-splash-status');

      function setBar(pct) {
        const clamped = Math.max(0, Math.min(100, Math.round(pct)));
        if (barEl) barEl.style.width = clamped + '%';
        if (pctEl) pctEl.textContent = clamped + '%';
      }

      function dismiss() {
        if (finished) return;
        finished = true;
        setBar(100);
        if (statusEl) statusEl.textContent = '準備完成！';
        setTimeout(() => {
          if (!splashEl) return;
          splashEl.classList.add('td-splash-exit');
          setTimeout(() => splashEl.remove(), 340);
        }, 200);
      }

      function tick(now) {
        if (finished) return;
        const elapsed = now - startTime;
        const ratio = Math.min(1, elapsed / MIN_MS);
        // 平滑緩出曲線，3 秒內推進至 94%，待背景同步完成補滿 100%
        const eased = 1 - Math.pow(1 - ratio, 2.2);
        const visualPct = 4 + eased * (syncReady ? 94 : 88);
        setBar(visualPct);

        if (elapsed >= MIN_MS && (syncReady || elapsed >= MAX_WAIT_MS)) {
          dismiss();
          return;
        }
        requestAnimationFrame(tick);
      }

      window.__TD_SPLASH = {
        setStatus(text) {
          if (!finished && statusEl && text) statusEl.textContent = text;
        },
        markReady() {
          syncReady = true;
        }
      };

      requestAnimationFrame(tick);
    })();
  </script>
  <script type="module" src="./js/app.js?v=3.16"></script>
</body>
</html>
