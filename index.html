<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TripDock｜旅行資訊綜合管理系統</title>
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TripDock" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />

  <!-- Tailwind CSS + Typography (供說明書 Markdown 排版) -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              900: '#134e4a'
            }
          }
        }
      }
    };
  </script>
  <!-- Marked.js 渲染內建 USER_GUIDE.md -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- 唯一設定檔（網頁與 Service Worker 共用） -->
  <script src="./js/config.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* ===== 輕量版 Liquid Glass 材質（僅套用於導覽列、分頁列與重點按鈕） ===== */
    .glass-header {
      background: rgba(255, 255, 255, 0.74);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 1px 12px rgba(15, 23, 42, 0.05);
    }
    .glass-bar {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 4px 16px rgba(15, 23, 42, 0.06);
    }
    .glass-btn-primary {
      background: linear-gradient(135deg, rgba(20, 184, 166, 0.88), rgba(15, 118, 110, 0.95));
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.34);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 4px 14px rgba(13, 148, 136, 0.24);
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.16s ease, filter 0.16s ease;
    }
    .glass-btn-primary:hover {
      filter: brightness(1.04);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 6px 18px rgba(13, 148, 136, 0.30);
    }
    .glass-btn-primary:active {
      transform: scale(0.965);
    }
    .glass-btn-teal-soft {
      background: linear-gradient(135deg, rgba(240, 253, 250, 0.92), rgba(204, 251, 241, 0.75));
      color: #0f766e;
      border: 1px solid rgba(94, 234, 212, 0.55);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 2px 8px rgba(13, 148, 136, 0.08);
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.16s ease;
    }
    .glass-btn-teal-soft:active {
      transform: scale(0.965);
    }
    .glass-btn-subtle {
      background: rgba(255, 255, 255, 0.75);
      color: #334155;
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 2px 8px rgba(15, 23, 42, 0.04);
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.16s ease;
    }
    .glass-btn-subtle:hover {
      background: rgba(248, 250, 252, 0.95);
    }
    .glass-btn-subtle:active {
      transform: scale(0.965);
    }
    .glass-btn-danger {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.90), rgba(225, 29, 72, 0.96));
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.38), 0 4px 12px rgba(225, 29, 72, 0.22);
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), filter 0.16s ease;
    }
    .glass-btn-danger:active {
      transform: scale(0.965);
    }

    /* ===== GPU 加速頁面與分頁切換動畫 ===== */
    @keyframes tdViewIn {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .td-view-enter {
      animation: tdViewIn 0.19s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* ===== GPU 加速 3D 卡片翻轉居中彈窗動畫（全站彈窗適用） ===== */
    .td-modal-stage {
      perspective: 1200px;
    }
    @keyframes tdBackdropIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes tdBackdropOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    @keyframes tdCardFlipIn {
      0% { opacity: 0; transform: rotateY(-24deg) scale(0.91); }
      100% { opacity: 1; transform: rotateY(0deg) scale(1); }
    }
    @keyframes tdCardFlipOut {
      0% { opacity: 1; transform: rotateY(0deg) scale(1); }
      100% { opacity: 0; transform: rotateY(16deg) scale(0.92); }
    }
    @keyframes tdCardFlipSwitch {
      0% { opacity: 0.25; transform: rotateY(-86deg) scale(0.96); }
      100% { opacity: 1; transform: rotateY(0deg) scale(1); }
    }
    .td-modal-backdrop-enter {
      animation: tdBackdropIn 0.18s ease-out both;
    }
    .td-modal-backdrop-exit {
      animation: tdBackdropOut 0.16s ease-in both;
    }
    .td-modal-panel {
      transform-style: preserve-3d;
      backface-visibility: hidden;
      will-change: transform, opacity;
    }
    .td-modal-panel-enter {
      animation: tdCardFlipIn 0.26s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .td-modal-panel-flip {
      animation: tdCardFlipSwitch 0.26s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .td-modal-panel-exit {
      animation: tdCardFlipOut 0.16s ease-in both;
    }

    /* ===== 手機版旅行卡片左滑刪除 ===== */
    .trip-swipe-card {
      touch-action: pan-y;
      will-change: transform;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <div id="app">
    <div class="min-h-screen flex items-center justify-center">
      <div class="text-center space-y-3">
        <div class="w-12 h-12 rounded-2xl bg-teal-600 mx-auto animate-pulse"></div>
        <p class="text-sm text-slate-500">TripDock 載入中...</p>
      </div>
    </div>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
